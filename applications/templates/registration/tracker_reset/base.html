<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}Password reset{% endblock %} | Internship Tracker</title>
<style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f3f6fb;
            color: #182238;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 500px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .panel {
            padding: 28px;
            border: 1px solid #dce3ee;
            border-radius: 12px;
            background: white;
        }

        h1 { margin-top: 0; }

        .field { margin-bottom: 22px; }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b8c3d4;
            border-radius: 8px;
            font: inherit;
        }

        input:focus {
            outline: 2px solid #2455c5;
            outline-offset: 2px;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #2455c5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        a { color: #2455c5; }

        .help {
            margin-top: 8px;
            color: #596579;
            font-size: 13px;
            line-height: 1.5;
        }

        .errorlist { color: #a12626; }
    
input { min-width: 0; }
.panel { overflow-wrap: anywhere; }
</style>
</head>
<body><main><section class="panel">
{% block content %}{% endblock %}
</section></main></body>
</html>
