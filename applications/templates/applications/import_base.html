<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Review imports{% endblock %} | Internship Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f3f6fb; color: #182238; font-family: Arial, sans-serif; }
        main { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        a { color: #2455c5; }
        p { line-height: 1.6; }
        .panel { background: white; border: 1px solid #dce3ee; border-radius: 12px; padding: 24px; margin: 20px 0; overflow-wrap: anywhere; }
        .muted { color: #596579; }
        .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin: 16px 0; }
        button, .button { display: inline-block; border: 0; border-radius: 8px; background: #2455c5; color: white; padding: 12px 18px; font: inherit; text-decoration: none; cursor: pointer; }
        .secondary { background: #edf0f5; color: #182238; }
        button:focus-visible, a:focus-visible { outline: 3px solid #2455c5; outline-offset: 3px; }
        .notice { background: #e5edff; padding: 14px; border-radius: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input, select, textarea { width: 100%; font: inherit; padding: 12px; border: 1px solid #b8c3d4; border-radius: 8px; }
        textarea { resize: vertical; }
        .field { margin-bottom: 24px; }
        .help { color: #596579; font-size: 14px; margin-top: 8px; }
        .errorlist { color: #a12626; }
        .preview { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.6; max-height: 420px; overflow-y: auto; }
        nav [aria-current="page"] { font-weight: bold; text-decoration-thickness: 3px; }
        /* Mobile layout and touch controls */
main {
    overflow-wrap: anywhere;
}

main > *, .panel, .field, form {
    min-width: 0;
}

input, select, textarea {
    max-width: 100%;
    min-width: 0;
    font-size: 16px;
}

input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]),
select, button, .button {
    min-height: 44px;
}

button, .button {
    max-width: 100%;
    white-space: normal;
    text-align: center;
}

textarea {
    resize: vertical;
}

.actions > *, .event-actions > * {
    min-width: 0;
}

nav.actions a,
.event-actions a,
main > a,
.history-link a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
}

.event-actions {
    flex-wrap: wrap;
}

a:focus-visible,
button:focus-visible,
summary:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex="0"]:focus-visible {
    outline: 3px solid #2455c5;
    outline-offset: 3px;
}

summary {
    min-height: 44px;
    padding: 12px 0;
    cursor: pointer;
}

.preview {
    max-width: 100%;
}

@media (max-width: 650px) {
    main {
        margin: 24px auto;
        padding: 0 14px;
    }

    h1 {
        font-size: 28px;
        line-height: 1.2;
    }

    h2 {
        font-size: 22px;
        line-height: 1.3;
    }

    .panel, .card, .action-card {
        padding: 16px;
    }

    .field {
        min-width: 0;
        width: 100%;
    }

    .actions:not(nav) {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
    }

    .actions:not(nav) > form,
    .actions:not(nav) > button,
    .actions:not(nav) > .button,
    .actions:not(nav) > form > button {
        width: 100%;
    }

    .actions:not(nav) > a {
        min-height: 44px;
        padding: 12px 0;
        text-align: center;
    }

    nav.actions {
        gap: 4px 16px;
    }

    .layout > .panel > form > button {
        width: 100%;
    }
}
input[type="checkbox"] {
    width: 22px;
    height: 22px;
    padding: 0;
    margin: 0;
    flex: 0 0 22px;
    accent-color: #2455c5;
}

#bulk-ignore-form label,
article.panel > label {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    cursor: pointer;
}

@media (max-width: 650px) {
    #bulk-ignore-form > button {
        width: 100%;
    }
}
    </style>
</head>
<body><main>
    <nav class="actions" aria-label="Tracker navigation">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'gmail_settings' %}">Connected email</a>
        <a href="{% url 'import_list' %}">Review imports</a>
    </nav>
    <div aria-live="polite">{% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}</div>
    {% block content %}{% endblock %}
</main></body>
</html>
